<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · TikTok Downloader</title>
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/themes.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet" />
  <style>
    body { display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .wrap { max-width: 460px; position: relative; z-index: 1; }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 8rem; font-weight: 600; line-height: 1;
      background: linear-gradient(135deg, #f472b6, #22d3ee, #ffffff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 { font-size: 1.2rem; font-weight: 600; margin: 1rem 0 0.5rem; color: var(--text); }
    p { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; margin-bottom: 2rem; }
    a {
      display: inline-block; padding: 0.85rem 1.75rem; border-radius: 12px;
      background: linear-gradient(135deg, #f472b6, #22d3ee);
      color: #0b0f19; font-weight: 700; font-size: 0.8rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
  </style>
</head>
<body data-theme="dark">
  <div class="ambient">
    <div class="blob blob-pink"></div>
    <div class="blob blob-cyan"></div>
  </div>
  <div class="wrap">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>This link must have been deleted.</p>
