<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a0b2e, #0d0517 70%);
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* floating orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            pointer-events: none;
        }
        body::before {
            width: 450px;
            height: 450px;
            background: #a855f7;
            top: -120px;
            right: -80px;
        }
        body::after {
            width: 500px;
            height: 500px;
            background: #3b82f6;
            bottom: -150px;
            left: -100px;
        }

        /* ── Main Card ── */
        .glass-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 620px;
            padding: 2rem 2rem 2.2rem;
            border-radius: 2.5rem;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px) saturate(1.3);
            -webkit-backdrop-filter: blur(24px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow:
                0 30px 60px -20px rgba(0, 0, 0, 0.8),
                inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s;
        }

        .glass-card:hover {
            box-shadow:
                0 40px 80px -20px rgba(0, 0, 0, 0.9),
                inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            margin-bottom: 0.75rem;
            font-size: 2.1rem;
            color: #fff;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.4);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f9f9ff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .header p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: 0.25rem;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        /* ── Input Area ── */
        .input-group {
            display: flex;
            gap: 0.65rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2rem;
            padding: 0.4rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border 0.25s, background 0.25s;
        }

        .input-group:focus-within {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.08);
        }

        .input-group input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: #fff;
            outline: none;
            font-weight: 400;
            letter-spacing: 0.01em;
            min-width: 0;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .input-group button {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 2rem;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
            letter-spacing: 0.01em;
            box-shadow: 0 4px 16px -4px rgba(109, 40, 217, 0.4);
        }

        .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 28px -6px rgba(109, 40, 217, 0.6);
        }

        .input-group button:active {
            transform: scale(0.97);
        }

        .input-group button i {
            font-size: 0.9rem;
        }

        /* ── Loading ── */
        .loader {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 1.5rem 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }

        .loader.active {
            display: flex;
        }

        .loader .spinner {
            width: 22px;
            height: 22px;
            border: 2.5px solid rgba(255, 255, 255, 0.08);
            border-top: 2.5px solid #a855f7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Result Card ── */
        .result {
            display: none;
            margin-top: 2rem;
            border-radius: 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            backdrop-filter: blur(4px);
            animation: fadeSlide 0.5s ease;
        }

        .result.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Video Preview ── */
        .video-preview {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            margin-bottom: 1.25rem;
        }

        .video-preview .avatar {
            flex-shrink: 0;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.4);
        }

        .video-preview .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-preview .info {
            flex: 1;
            min-width: 0;
        }

        .video-preview .info .author {
            font-weight: 600;
            color: #fff;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .video-preview .info .author .badge {
            font-size: 0.6rem;
            font-weight: 500;
            background: rgba(168, 85, 247, 0.25);
            color: #c4b5fd;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            letter-spacing: 0.02em;
            border: 1px solid rgba(168, 85, 247, 0.10);
        }

        .video-preview .info .desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            margin-top: 0.3rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-preview .info .stats {
            display: flex;
            gap: 1.2rem;
            margin-top: 0.5rem;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.78rem;
            font-weight: 400;
        }

        .video-preview .info .stats i {
            margin-right: 0.25rem;
            color: rgba(255, 255, 255, 0.2);
        }

        /* ── Download Buttons ── */
        .download-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 0.25rem;
        }

        .download-actions .btn {
            flex: 1;
            min-width: 120px;
            padding: 0.85rem 1.2rem;
            border-radius: 1.8rem;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            text-decoration: none;
            color: #fff;
            letter-spacing: 0.01em;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
        }

        .download-actions .btn i {
            font-size: 0.95rem;
        }

        .download-actions .btn-video {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-color: transparent;
            box-shadow: 0 4px 16px -4px rgba(109, 40, 217, 0.35);
        }

        .download-actions .btn-video:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px -6px rgba(109, 40, 217, 0.55);
        }

        .download-actions .btn-audio {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .download-actions .btn-audio:hover {
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .download-actions .btn:active {
            transform: scale(0.96);
        }

        /* ── Error ── */
        .error-msg {
            display: none;
            margin-top: 1rem;
            padding: 0.8rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            font-size: 0.85rem;
            text-align: center;
            animation: fadeSlide 0.3s ease;
        }

        .error-msg.active {
            display: block;
        }

        /* ── Footer ── */
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ── Responsive ── */
        @media (max-width: 540px) {
            .glass-card {
                padding: 1.5rem 1.2rem 1.8rem;
                border-radius: 1.8rem;
            }

            .header h1 {
                font-size: 1.4rem;
            }
            .header .icon-wrap {
                width: 56px;
                height: 56px;
                font-size: 1.6rem;
                border-radius: 16px;
            }

            .input-group {
                flex-direction: column;
                background: transparent;
                padding: 0;
                border: none;
                gap: 0.6rem;
            }

            .input-group input {
                background: rgba(255, 255, 255, 0.04);
                border-radius: 2rem;
                padding: 0.9rem 1.2rem;
                border: 1px solid rgba(255, 255, 255, 0.06);
            }

            .input-group input:focus {
                border-color: rgba(168, 85, 247, 0.3);
            }

            .input-group button {
                justify-content: center;
                padding: 0.9rem 1.2rem;
                width: 100%;
            }

            .video-preview {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .video-preview .avatar {
                width: 80px;
                height: 80px;
            }

            .video-preview .info .stats {
                justify-content: center;
            }

            .download-actions .btn {
                min-width: 100px;
                padding: 0.75rem 1rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 380px) {
            .glass-card {
                padding: 1.2rem 0.9rem 1.4rem;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .download-actions {
                flex-direction: column;
            }
            .download-actions .btn {
                min-width: unset;
            }
        }
    </style>
</head>
<body>

    <div class="glass-card">

        <!-- Header -->
        <div class="header">
            <div class="icon-wrap">
                <i class="fab fa-tiktok"></i>
            </div>
            <h1>TikTok Downloader</h1>
            <p>Paste any TikTok link &amp; save videos or audio</p>
        </div>

        <!-- Input -->
        <div class="input-group">
            <input
            type="text"
            id="urlInput"
            placeholder="https://vt.tiktok.com/..."
            spellcheck="false"
            autofocus
            />
            <button id="fetchBtn">
                <i class="fas fa-arrow-right"></i> Get
            </button>
        </div>

        <!-- Loader -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span>Fetching video…</span>
        </div>

        <!-- Error -->
        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-circle" style="margin-right:0.4rem;"></i>
            <span id="errorText">Something went wrong.</span>
        </div>

        <!-- Result -->
        <div class="result" id="result">

            <!-- Preview -->
            <div class="video-preview">
                <div class="avatar">
                    <img id="avatarImg" src="" alt="Profile" />
                </div>
                <div class="info">
                    <div class="author">
                        <span id="authorName">—</span>
                        <span class="badge">Krypton</span>
                    </div>
                    <div class="desc" id="descText">—</div>
                    <div class="stats">
                        <span><i class="fas fa-heart"></i> <span id="likeCount">0</span></span>
                        <span><i class="fas fa-comment"></i> <span id="commentCount">0</span></span>
                    </div>
                </div>
            </div>

            <!-- Download Buttons -->
            <div class="download-actions">
                <a class="btn btn-video" id="downloadVideo" href="#" download target="_blank">
                    <i class="fas fa-video"></i> Video
                </a>
                <a class="btn btn-audio" id="downloadAudio" href="#" download target="_blank">
                    <i class="fas fa-music"></i> Audio
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            powered by <a href="#" target="_blank">Kryptonite API</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── DOM refs ──
            const urlInput = document.getElementById('urlInput');
            const fetchBtn = document.getElementById('fetchBtn');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const result = document.getElementById('result');

            const avatarImg = document.getElementById('avatarImg');
            const authorName = document.getElementById('authorName');
            const descText = document.getElementById('descText');
            const likeCount = document.getElementById('likeCount');
            const commentCount = document.getElementById('commentCount');
            const downloadVideo = document.getElementById('downloadVideo');
            const downloadAudio = document.getElementById('downloadAudio');

            const API_BASE =
                'https://kryptonite-api-library.vercel.app/api/tikdl?url=';

            // ── Helpers ──
            function showLoader(show) {
                loader.classList.toggle('active', show);
            }

            function showError(msg) {
                if (msg) {
                    errorText.textContent = msg;
                    errorMsg.classList.add('active');
                } else {
                    errorMsg.classList.remove('active');
                }
            }

            function showResult(show) {
                result.classList.toggle('active', show);
            }

            function resetUI() {
                showResult(false);
                showError(null);
                showLoader(false);
            }

            // ── Fetch & render ──
            async function fetchTikTok(url) {
                resetUI();

                if (!url || !url.trim()) {
                    showError('Please paste a TikTok link first.');
                    return;
                }

                // Basic URL validation
                const trimmed = url.trim();
                if (!trimmed.startsWith('http://') && !trimmed.startsWith('https://')) {
                    showError('Please enter a valid URL (starts with http:// or https://).');
                    return;
                }

                // Encode
                const encoded = encodeURIComponent(trimmed);
                const fullUrl = API_BASE + encoded;

                showLoader(true);

                try {
                    const response = await fetch(fullUrl, {
                        method: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!response.ok) {
                        let errMsg = `Server error (${response.status})`;
                        try {
                            const errData = await response.json();
                            if (errData && errData.message) errMsg = errData.message;
                        } catch (_) { /* ignore */ }
                        throw new Error(errMsg);
                    }

                    const data = await response.json();

                    // Validate expected fields
                    if (!data || typeof data !== 'object') {
                        throw new Error('Invalid response from server.');
                    }

                    // Some fallbacks
                    const profilePic = data.profilePic || '';
                    const author = data.author || 'Unknown';
                    const description = data.description || '';
                    const likes = data.likes || '0';
                    const comments = data.comments || '0';
                    const videoLink = data.downloadLink || '';
                    const audioLink = data.mp3DownloadLink || '';

                    if (!videoLink && !audioLink) {
                        throw new Error('No download links available for this video.');
                    }

                    // ── Render ──
                    avatarImg.src = profilePic || 'https://ui-avatars.com/api/?name=U&background=6d28d9&color=fff&size=64';
                    avatarImg.alt = author;
                    authorName.textContent = author;
                    descText.textContent = description || 'No description.';
                    likeCount.textContent = likes;
                    commentCount.textContent = comments;

                    // Download links
                    if (videoLink) {
                        downloadVideo.href = videoLink;
                        downloadVideo.style.display = 'inline-flex';
                    } else {
                        downloadVideo.style.display = 'none';
                    }

                    if (audioLink) {
                        downloadAudio.href = audioLink;
                        downloadAudio.style.display = 'inline-flex';
                    } else {
                        downloadAudio.style.display = 'none';
                    }

                    // If no video but audio exists, hide video button
                    if (!videoLink && audioLink) {
                        downloadVideo.style.display = 'none';
                    }

                    showResult(true);
                    showError(null);

                } catch (err) {
                    showError(err.message || 'Failed to fetch video. Please try again.');
                    showResult(false);
                } finally {
                    showLoader(false);
                }
            }

            // ── Event listeners ──
            fetchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                fetchTikTok(urlInput.value);
            });

            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    fetchBtn.click();
                }
            });

            // ── Prefill with example on first visit ──
            // (but only if input is empty)
            if (!urlInput.value) {
                urlInput.placeholder = 'https://vt.tiktok.com/...';
                // Optionally, set a default example for demo:
                // urlInput.value = 'https://vt.tiktok.com/ZSVXFuUAE/';
            }

            // ── Handle download clicks (optional tracking) ──
            downloadVideo.addEventListener('click', function(e) {
                if (!this.href || this.href === '#') {
                    e.preventDefault();
                    showError('Video download link is not available.');
                }
            });

            downloadAudio.addEventListener('click', function(e) {
                if (!this.href || this.href === '#') {
                    e.preventDefault();
                    showError('Audio download link is not available.');
                }
            });

            // ── Expose for console debugging ──
            window.__tikdl = { fetchTikTok };

            console.log('✨ TikTok Downloader ready');
        })();
    </script>

</body>
</html>
